server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve valid files, else show 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404 page
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Favicon
    location = /favicon.ico {
        try_files /img/favicon.ico = 204;
        access_log off;
        log_not_found off;
    }

    # Cache static assets 
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1M;
        access_log off;
        log_not_found off;
    }
}
